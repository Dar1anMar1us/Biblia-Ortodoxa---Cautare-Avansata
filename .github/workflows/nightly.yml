name: Nightly E2E Tests

on:
  schedule:
    # Rulează în fiecare seară la 22:00 UTC (00:00 Romania)
    - cron: '0 22 * * *'
  workflow_dispatch:    # permite trigger manual din UI GitHub
  push:
    branches: [trunk, development]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout cod
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Instalare dependențe
        run: npm ci

      - name: 🚀 Pornire server
        run: |
          node server.js &
          sleep 2
          curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/api/books

      - name: 🧪 Rulează teste E2E (Cypress)
        uses: cypress-io/github-action@v6
        with:
          install: false
          browser: electron

      - name: 📸 Upload screenshot-uri (dacă teste pică)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/
          retention-days: 7

      - name: 📋 Upload video-uri (dacă există)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/
          retention-days: 3

      - name: ✅ Raport final
        run: |
          echo "## 📊 Rezultate teste Biblia Ortodoxă" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Data:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Vezi detalii în tab-ul **Summary** de mai sus." >> $GITHUB_STEP_SUMMARY
