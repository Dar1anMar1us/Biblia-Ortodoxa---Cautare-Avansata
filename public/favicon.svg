<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="4" fill="#1a1a2e"/>
  <!-- Orthodox cross -->
  <g stroke="#c9a84c" stroke-width="2" stroke-linecap="round" fill="none">
    <!-- vertical bar -->
    <line x1="16" y1="5" x2="16" y2="27"/>
    <!-- top bar -->
    <line x1="9" y1="10" x2="23" y2="10"/>
    <!-- middle (slanted) bar -->
    <line x1="10" y1="16" x2="22" y2="16"/>
    <!-- bottom slanted (Orthodox style) -->
    <line x1="13" y1="21" x2="19" y2="23"/>
  </g>
  <!-- open book glow behind cross -->
  <path d="M8 20 Q16 16 24 20 Q16 18 8 20Z" fill="#c9a84c" opacity="0.15"/>
</svg>
