<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary Meta Tags -->
  <title>Biblia Ortodoxă — Căutare avansată, citire online</title>
  <meta name="title" content="Biblia Ortodoxă — Căutare avansată, citire online">
  <meta name="description" content="Citește și caută în Biblia Ortodoxă online. Peste 36.000 de versete în limba română din Vechiul Testament, Noul Testament și Cărțile Deuterocanonice. Căutare full-text rapidă.">
  <meta name="keywords" content="Biblia Ortodoxă, Biblie, Vechiul Testament, Noul Testament, Deuterocanonice, scriptură, citire biblie online, carte sfântă, ortodox, credință">
  <meta name="robots" content="index, follow">
  <meta name="language" content="Romanian">
  <meta name="author" content="Darian Marius Chircă">

  <!-- Theme Color -->
  <meta name="theme-color" content="#1a1a2e">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://bibliaortodoxa.org/">
  <meta property="og:title" content="Biblia Ortodoxă — Căutare avansată, citire online">
  <meta property="og:description" content="Citește și caută în Biblia Ortodoxă online. Peste 36.000 de versete din VT, NT și Deuterocanonice. Căutare full-text rapidă.">
  <meta property="og:image" content="https://bibliaortodoxa.org/og-image.png">

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image">
  <meta property="twitter:url" content="https://bibliaortodoxa.org/">
  <meta property="twitter:title" content="Biblia Ortodoxă — Căutare avansată, citire online">
  <meta property="twitter:description" content="Citește și caută în Biblia Ortodoxă online. Peste 36.000 de versete din VT, NT și Deuterocanonice.">
  <meta property="twitter:image" content="https://bibliaortodoxa.org/og-image.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="canonical" href="https://bibliaortodoxa.org/">

  <!-- JSON-LD Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "Biblia Ortodoxă",
    "url": "https://bibliaortodoxa.org/",
    "description": "Citește și caută în Biblia Ortodoxă online. Peste 36.000 de versete din Vechiul Testament, Noul Testament și Cărțile Deuterocanonice.",
    "inLanguage": "ro",
    "author": {
      "@type": "Person",
      "name": "Darian Marius Chircă"
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://bibliaortodoxa.org/search?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8d48b;
      --dark: #1a1a2e;
      --darker: #12121f;
      --card-bg: #1e1e36;
      --text: #e8e0d0;
      --text-dim: #9990a0;
      --accent: #d4a843;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Georgia', 'Times New Roman', serif;
      background: var(--darker);
      color: var(--text);
      min-height: 100vh;
    }
    .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

    /* Header */
    header {
      background: var(--dark);
      border-bottom: 2px solid var(--gold);
      padding: 20px 0;
      margin-bottom: 30px;
    }
    header .container {
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 15px;
    }
    .logo {
      font-size: 1.6em; font-weight: bold; color: var(--gold);
      text-decoration: none; letter-spacing: 1px;
    }
    .logo small { font-size: 0.5em; color: var(--text-dim); display: block; }

    /* Search */
    .search-box { flex: 1; min-width: 250px; position: relative; }
    .search-box form { display: flex; gap: 8px; }
    .search-box input {
      flex: 1; padding: 10px 14px; border: 1px solid #333; border-radius: 6px;
      background: var(--darker); color: var(--text); font-size: 1em;
      font-family: inherit;
    }
    .search-box input:focus { outline: none; border-color: var(--gold); }
    .search-box button {
      padding: 10px 20px; background: var(--gold); color: #000;
      border: none; border-radius: 6px; cursor: pointer; font-weight: bold;
      font-family: inherit;
    }
    .search-box button:hover { background: var(--gold-light); }

    /* Search suggestions */
    .suggestions {
      position: absolute; top: 100%; left: 0; right: 0; z-index: 100;
      background: var(--card-bg); border: 1px solid #333; border-radius: 0 0 6px 6px;
      display: none; max-height: 250px; overflow-y: auto;
    }
    .suggestions div {
      padding: 8px 14px; cursor: pointer; border-bottom: 1px solid #2a2a3e;
      font-size: 0.9em;
    }
    .suggestions div:hover { background: #2a2a4e; }
    .suggestions .ref { color: var(--gold); font-size: 0.8em; }
    .suggestions .preview { color: var(--text-dim); }

    /* Stats bar */
    .stats {
      text-align: center; margin-bottom: 25px; color: var(--text-dim);
      font-size: 0.9em;
    }
    .stats strong { color: var(--gold); }

    /* Book list (homepage) */
    .testament-section { margin-bottom: 30px; }
    .testament-title {
      font-size: 1.3em; color: var(--gold); border-bottom: 1px solid #333;
      padding-bottom: 8px; margin-bottom: 12px; text-transform: uppercase;
      letter-spacing: 2px;
    }
    .book-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
      gap: 8px;
    }
    .book-card {
      background: var(--card-bg); padding: 10px 14px; border-radius: 6px;
      cursor: pointer; transition: 0.2s; text-decoration: none; color: var(--text);
      border: 1px solid transparent;
    }
    .book-card:hover {
      border-color: var(--gold); background: #252545;
    }
    .book-card .name { font-size: 0.95em; }
    .book-card .meta { font-size: 0.75em; color: var(--text-dim); margin-top: 3px; }

    /* Chapter view */
    .chapter-header {
      margin-bottom: 20px; padding-bottom: 15px; border-bottom: 1px solid #333;
    }
    .chapter-header h1 { font-size: 1.5em; color: var(--gold); }
    .chapter-header .subtitle { color: var(--text-dim); font-size: 0.9em; margin-top: 4px; }
    .chapter-nav {
      display: flex; flex-wrap: wrap; gap: 6px; margin: 15px 0;
    }
    .chapter-nav a {
      display: inline-block; padding: 4px 10px; border-radius: 4px;
      background: var(--card-bg); color: var(--text); text-decoration: none;
      font-size: 0.85em; border: 1px solid #333;
    }
    .chapter-nav a.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .chapter-nav a:hover:not(.active) { border-color: var(--gold); }
    .chapter-nav a.disabled { opacity: 0.3; pointer-events: none; cursor: default; }
    .chapter-nav select {
      background: var(--card-bg); color: var(--text); border: 1px solid #333;
      border-radius: 4px; padding: 4px 10px; font-size: 0.9em; font-family: inherit;
      cursor: pointer; min-width: 140px;
    }
    .chapter-nav select:hover { border-color: var(--gold); }
    .chapter-nav select:focus { outline: none; border-color: var(--gold); }

    /* Verses */
    .verse {
      padding: 10px 14px; border-radius: 4px; margin-bottom: 4px;
      transition: 0.2s;
    }
    .verse:hover { background: rgba(201, 168, 76, 0.05); }
    .verse .num {
      color: var(--gold); font-weight: bold; margin-right: 8px;
      display: inline-block; min-width: 24px;
    }
    .verse .text { line-height: 1.7; }

    /* Search results */
    .result {
      background: var(--card-bg); padding: 14px 18px; border-radius: 6px;
      margin-bottom: 10px; border: 1px solid #2a2a3e;
    }
    .result:hover { border-color: var(--gold); }
    .result .ref {
      color: var(--gold); font-weight: bold; font-size: 0.9em;
      cursor: pointer; text-decoration: none;
    }
    .result .ref:hover { text-decoration: underline; }
    .result .text { margin-top: 6px; line-height: 1.6; }
    .result .text mark { background: rgba(201, 168, 76, 0.3); color: var(--gold-light); padding: 1px 3px; border-radius: 2px; }
    .result .meta { margin-top: 6px; font-size: 0.8em; color: var(--text-dim); }
    .results-count { margin-bottom: 15px; color: var(--text-dim); }
    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-dim); }
    .empty-state .icon { font-size: 3em; margin-bottom: 15px; }

    /* Facets */
    .facets {
      display: flex; flex-wrap: wrap; gap: 8px; margin: 15px 0 25px;
    }
    .facet {
      background: var(--card-bg); padding: 5px 12px; border-radius: 20px;
      font-size: 0.85em; cursor: pointer; border: 1px solid #333;
      color: var(--text); text-decoration: none;
    }
    .facet:hover { border-color: var(--gold); }
    .facet .count { color: var(--gold); margin-left: 4px; }

    /* Pagination */
    .pagination {
      display: flex; justify-content: center; gap: 8px; margin: 25px 0;
    }
    .pagination a {
      padding: 6px 14px; border-radius: 4px; background: var(--card-bg);
      color: var(--text); text-decoration: none; border: 1px solid #333;
    }
    .pagination a:hover { border-color: var(--gold); }
    .pagination a.active { background: var(--gold); color: #000; border-color: var(--gold); }
    .pagination a.disabled { opacity: 0.3; pointer-events: none; }

    /* Footer */
    footer {
      text-align: center; padding: 30px 0; color: var(--text-dim);
      font-size: 0.85em; border-top: 1px solid #222; margin-top: 40px;
    }
    footer a { color: var(--gold); text-decoration: none; }

    /* Loading — elegant spinner theme */
    #loadingOverlay {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 80px 20px;
      transition: opacity 0.3s ease;
    }
    #loadingOverlay.hidden {
      display: none;
    }
    .loader-ring {
      width: 48px; height: 48px;
      border: 2px solid rgba(201, 168, 76, 0.15);
      border-top-color: var(--gold);
      border-right-color: var(--gold);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .loader-text {
      margin-top: 18px;
      font-size: 0.85em; color: var(--gold);
      letter-spacing: 0.1em; font-family: Georgia, serif;
      animation: pulse-text 1.5s ease-in-out infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse-text {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
    .loading { text-align: center; padding: 60px 20px; color: var(--text-dim); }

    /* Verse highlighting in URL fragments */
    :target { background: rgba(201, 168, 76, 0.15); border-left: 3px solid var(--gold); }
    .verse:target { background: rgba(201, 168, 76, 0.15); border-left: 3px solid var(--gold); }

    /* Pulse animation for search-navigated verses */
    @keyframes pulse-highlight {
      0% { background: rgba(201, 168, 76, 0.5); border-left: 3px solid var(--gold); box-shadow: 0 0 12px rgba(201, 168, 76, 0.4); }
      25% { background: rgba(201, 168, 76, 0.7); border-left: 3px solid var(--gold-light); box-shadow: 0 0 20px rgba(201, 168, 76, 0.6); }
      50% { background: rgba(201, 168, 76, 0.8); border-left: 3px solid #ffd700; box-shadow: 0 0 28px rgba(201, 168, 76, 0.7); }
      75% { background: rgba(201, 168, 76, 0.4); border-left: 3px solid var(--gold); box-shadow: 0 0 12px rgba(201, 168, 76, 0.3); }
      100% { background: rgba(201, 168, 76, 0.15); border-left: 3px solid var(--gold); box-shadow: none; }
    }
    .verse.pulse {
      animation: pulse-highlight 1.5s ease-out forwards;
      animation-iteration-count: 2;
    }

    .hidden { display: none; }

    /* Save button */
    .save-btn {
      background: var(--card-bg); color: var(--text); border: 1px solid #333;
      padding: 5px 12px; border-radius: 4px; cursor: pointer;
      font-size: 0.85em; font-family: inherit; transition: 0.2s;
    }
    .save-btn:hover { border-color: var(--gold); color: var(--gold); }
    .save-btn.saved { border-color: #4caf50; color: #4caf50; }
    .save-btn:disabled { opacity: 0.5; cursor: default; }
    .save-status { font-size: 0.8em; color: var(--text-dim); line-height: 30px; }
    .saved-chapter { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; background: var(--card-bg); border-radius: 3px; font-size: 0.85em; border: 1px solid #333; margin: 2px; }
    .saved-chapter .del { cursor: pointer; color: #e57373; margin-left: 2px; }
    .saved-chapter .del:hover { color: #ff0000; }
    .saved-book { margin-bottom: 15px; }
    .saved-book-title { color: var(--gold); margin-bottom: 6px; font-size: 1em; }

    @media (max-width: 600px) {
      .book-grid { grid-template-columns: repeat(2, 1fr); }
      header .container { flex-direction: column; }
      .search-box { width: 100%; }
    }

    /* Navigation tabs */
    .nav-tab {
      color: var(--text-dim); text-decoration: none;
      padding: 4px 12px; border-radius: 4px;
      border: 1px solid transparent; transition: 0.2s;
      font-size: 0.9em;
    }
    .nav-tab:hover { color: var(--gold); border-color: #333; }
    .nav-tab.active { color: var(--gold); border-color: var(--gold); background: rgba(201,168,76,0.1); }

    /* Calendar styles */
    .cal-nav {
      display: flex; align-items: center; justify-content: center;
      gap: 8px; margin-bottom: 20px; flex-wrap: wrap;
    }
    .cal-nav button, .cal-nav select {
      background: var(--card-bg); color: var(--text); border: 1px solid #333;
      border-radius: 4px; padding: 6px 10px; font-size: 0.95em;
      cursor: pointer; font-family: inherit;
    }
    .cal-nav button:hover { border-color: var(--gold); }
    .cal-nav select:hover { border-color: var(--gold); }
    .cal-nav select:focus { outline: none; border-color: var(--gold); }
    .cal-nav .nav-group {
      display: flex; align-items: center; gap: 4px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px; margin-bottom: 20px;
    }
    .cal-header {
      text-align: center; font-size: 0.8em; color: var(--gold);
      padding: 6px 0; font-weight: bold; text-transform: uppercase;
      letter-spacing: 1px;
    }
    .cal-day {
      text-align: center; padding: 8px 4px; border-radius: 4px;
      background: var(--card-bg); border: 1px solid #2a2a3e;
      cursor: pointer; transition: 0.2s; font-size: 0.9em;
      position: relative;
    }
    .cal-day .day-num { font-weight: bold; font-size: 1em; }
    .cal-day .day-name { font-size: 0.65em; color: var(--text-dim); display: block; margin-top: 2px; }
    .cal-day:hover { border-color: var(--gold); background: #252545; }
    .cal-day.today { border-color: var(--gold); box-shadow: 0 0 8px rgba(201,168,76,0.3); position: relative; }
    .cal-day.today::after {
      content: '●'; position: absolute; top: -2px; right: 2px;
      font-size: 8px; color: var(--gold);
    }
    .cal-day.selected { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.3); border-width: 2px; }
    .cal-day.today.selected { box-shadow: 0 0 8px rgba(201,168,76,0.3); }
    .cal-day.sarbatoare { border-left: 3px solid var(--gold); }
    .cal-day.post { border-left: 3px solid #c0392b; }
    .cal-day.empty { background: transparent; border: none; cursor: default; }
    .cal-day.empty:hover { border: none; }

    .cal-detail {
      background: var(--card-bg); border: 1px solid #333;
      border-radius: 6px; padding: 20px; margin-top: 10px;
    }
    .cal-detail h2 { color: var(--gold); font-size: 1.2em; margin-bottom: 8px; }
    .cal-detail .day-of-week { color: var(--text-dim); font-size: 0.9em; }
    .cal-detail .saint-name { font-size: 1.1em; margin: 10px 0; line-height: 1.6; }
    .cal-detail .fast-info { color: #e57373; font-size: 0.9em; margin: 6px 0; }
    .cal-detail .sunday-info { color: var(--gold-light); font-size: 0.9em; margin: 6px 0; font-style: italic; }
    .cal-detail .sunday-gospel { color: var(--text-dim); font-size: 0.85em; margin: 4px 0; }
    .cal-detail .feast { color: var(--gold); font-weight: bold; }

    .cal-legend-item .dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    }
    .cal-legend { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.8em; }
    .cal-legend-item { display: flex; align-items: center; gap: 6px; color: var(--text-dim); }

    .cal-today-banner {
      background: rgba(201,168,76,0.08);
      border: 1px solid var(--gold);
      border-radius: 6px; padding: 12px 18px; margin-bottom: 20px;
    }
    .cal-today-banner .label { color: var(--text-dim); font-size: 0.85em; }
    .cal-today-banner .value { color: var(--gold); font-size: 1em; }
    .cal-today-banner .saint { font-size: 0.9em; color: var(--text); }

    /* Decorative pin */
    .cal-pin {
      position: absolute; top: 8px; right: 12px;
      font-size: 14px; pointer-events: none;
      user-select: none;
    }

    @media (max-width: 600px) {
      .cal-nav { gap: 6px; }
      .cal-nav button, .cal-nav select { padding: 5px 7px; font-size: 0.85em; }
      .cal-grid { gap: 2px; }
      .cal-day { padding: 5px 2px; font-size: 0.75em; }
      .cal-day .day-num { font-size: 0.9em; }
      .cal-day .day-name { display: none; }
      .cal-header { font-size: 0.7em; padding: 4px 0; letter-spacing: 0.5px; }
      .cal-day.sarbatoare { border-left-width: 2px; }
      .cal-day.post { border-left-width: 2px; }
      .cal-day.selected { border-width: 2px; }
      .cal-day.today::after { top: -1px; right: 1px; font-size: 6px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="container">
      <div style="display:flex;align-items:center;gap:15px;flex-wrap:wrap">
        <a href="/" class="logo">
          📖 BibliaOrtodoxă
          <small>Căutare avansată</small>
        </a>
        <nav style="display:flex;gap:6px;font-size:0.85em">
          <a href="/" class="nav-tab" data-spa>Biblie</a>
          <a href="/calendar" class="nav-tab" data-spa>📅 Calendar</a>
        </nav>
      </div>
      <div class="search-box">
        <form id="searchForm" action="/search">
          <input type="text" id="searchInput" name="q" placeholder="Caută în Biblie... cuvinte, fraze, orice" autocomplete="off">
          <button type="submit">Caută</button>
        </form>
        <div class="suggestions" id="suggestions"></div>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <div id="loadingOverlay">
      <div class="loader-ring"></div>
      <div class="loader-text">Se încarcă...</div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>Biblia Ortodoxă — Căutare full-text cu suport pentru cuvinte, fraze, AND/OR/NOT</p>
      <p style="margin-top: 5px">
        <a href="/">Toate cărțile</a> ·
        <a href="/salvate" data-spa>📚 Salvate</a> ·
        <a href="/calendar" data-spa>📅 Calendar</a> ·
        <a href="/api/books">API</a> ·
        Sursă: <a href="https://www.bibliaortodoxa.ro" target="_blank">bibliaortodoxa.ro</a>
      </p>
      <p style="margin-top: 8px; font-size: 0.85em; color: var(--text-dim)">
        Făcută cu ❤️ de <strong>Darian Marius Chircă</strong>
      </p>
    </div>
  </footer>

  <script>
    // ─── Router ──────────────────────────────────────────────
    function getRoute() {
      const path = window.location.pathname;
      const params = new URLSearchParams(window.location.search);

      if (path === '/' || path === '') return { page: 'home' };

      const matchBook = path.match(/^\/carte\/([^\/]+)(?:\/capitol\/(\d+))?$/);
      if (matchBook) {
        return {
          page: 'chapter',
          bookName: decodeURIComponent(matchBook[1]),
          chapter: matchBook[2] ? parseInt(matchBook[2]) : 1
        };
      }

      if (path === '/search') {
        return { page: 'search', q: params.get('q'), carte: params.get('carte'), limit: params.get('limit'), offset: parseInt(params.get('offset') || '0') };
      }

      if (path === '/salvate') {
        return { page: 'saved' };
      }

      if (path === '/calendar') {
        return { page: 'calendar' };
      }

      return { page: 'home' };
    }

    // ─── API helper ──────────────────────────────────────────
    async function api(url) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(await res.text());
      return res.json();
    }

    // ─── Router / Navigation ─────────────────────────────────
    function navigate(url) {
      window.history.pushState({}, '', url);
      window.scrollTo(0, 0);
      render();
    }

    window.addEventListener('popstate', () => {
      window.scrollTo(0, 0);
      render();
    });

    // ─── SPA link interceptor ────────────────────────────────
    document.addEventListener('click', function(e) {
      const link = e.target.closest('[data-spa], .chapter-nav a, .pagination a, .facet');
      if (!link) return;
      if (link.classList.contains('disabled') || link.classList.contains('active')) {
        e.preventDefault();
        return;
      }
      const href = link.getAttribute('href');
      if (!href || href.startsWith('http')) return;
      e.preventDefault();
      navigate(href);
    });

    // ─── Loader helpers ──────────────────────────────────────
    function showLoader(text) {
      const app = document.getElementById('app');
      const overlay = document.getElementById('loadingOverlay');
      const loaderText = overlay.querySelector('.loader-text');
      loaderText.textContent = text || 'Se încarcă...';
      overlay.classList.remove('hidden');
      // Clear any previous content
      app.querySelectorAll(':scope > :not(#loadingOverlay)').forEach(el => el.remove());
    }

    function showContent(html) {
      const overlay = document.getElementById('loadingOverlay');

    async function renderChapter(bookName, chapter) {
      showLoader('Se încarcă...');

      let data, fromOffline = false;

      try {
        data = await api(`/api/books/${encodeURIComponent(bookName)}/chapters/${chapter}`);
      } catch (err) {
        // Fallback: încearcă din IndexedDB (offline)
        try {
          const saved = await isChapterSaved(bookName, chapter);
          if (saved && saved.data) {
            data = saved.data;
            fromOffline = true;
          } else {
            throw new Error('Capitolul nu este salvat offline');

          showContent(`<div class="empty-state"><div class="icon">❌</div><p>Eroare: ${err.message}</p><p style="margin-top:6px;color:var(--text-dim)">Capitolul nu este disponibil offline. Salvează-l când ai internet.</p></div>`);
          return;
        }
      }

      const bookNameEncoded = encodeURIComponent(data.book ? data.book.nume : bookName);
      const totalCapitole = data.total_capitole || data.versete.reduce((max, v) => Math.max(max, v.capitol || chapter), chapter);

      let html = `
        <div class="chapter-header">
          <h1>${data.book ? data.book.nume : bookName} — Capitolul ${data.capitol}</h1>
          <div class="subtitle">${data.total_versete || data.versete.length} versete ${fromOffline ? '· 📡 offline' : ''}</div>

          </div>

            <a href="/" class="${!data.navigare || (!data.navigare.precedent && !data.navigare.urmator) ? 'active' : ''}" title="Înapoi la cărți">📖</a>
            ${data.navigare && data.navigare.precedent ? `<a href="/carte/${bookNameEncoded}/capitol/${data.navigare.precedent}" title="Capitolul ${data.navigare.precedent}">◀</a>` : '<a class="disabled">◀</a>'}
            <select id="chapterSelect" onchange="navigate('/carte/${bookNameEncoded}/capitol/' + this.value)">
              ${Array.from({length: totalCapitole}, (_, i) => i + 1).map(c =>
                `<option value="${c}" ${c === data.capitol ? 'selected' : ''}>Capitolul ${c}</option>`
              ).join('')}
            </select>
            ${data.navigare && data.navigare.urmator ? `<a href="/carte/${bookNameEncoded}/capitol/${data.navigare.urmator}" title="Capitolul ${data.navigare.urmator}">▶</a>` : '<a class="disabled">▶</a>'}
          </div>
        </div>
        <div class="verses">
          ${data.versete.map(v => `
            <div class="verse" id="${v.numar}">
              <span class="num">${v.numar}.</span>
              <span class="text">${escapeHtml(v.text)}</span>
            </div>
          `).join('')}
        </div>
      `;

      showContent(html);

      // Check if this chapter is saved
      if (fromOffline) {
        // Dacă am citit din IndexedDB, știm sigur că e salvat
        const btn = document.getElementById('saveBtn');
        if (btn) { btn.textContent = '✓ Salvat ✔'; btn.classList.add('saved'); }
      } else {
        checkIfSaved(bookNameEncoded, data.capitol);

      requestAnimationFrame(() => {

            el.scrollIntoView({ behavior: 'smooth', block: 'center' });

            el.addEventListener('animationend', function onEnd() {
              el.classList.remove('pulse');

    async function renderSearch(q, carte, limit, offset) {
      showLoader('Se caută...');

      try {
        const params = new URLSearchParams({ q, limit: limit || 20, offset: offset || 0 });
        if (carte) params.set('carte', carte);
        const data = await api(`/api/search?${params}`);

        if (data.total === 0) {
          showContent(`
            <div class="empty-state">
              <div class="icon">🔍</div>
              <p>Niciun rezultat pentru <strong>${escapeHtml(q)}</strong></p>
              <p style="margin-top:8px;color:var(--text-dim)">Încearcă alt cuvânt, o frază, sau "cuvânt1 AND cuvânt2"</p>
              <div style="margin-top:15px">
                <a href="/" class="facet">📖 Navighează cărți</a>
              </div>
            </div>
          `);
          // Update search input
          document.getElementById('searchInput').value = q;
          return;
        }

        let html = `
          <div class="results-count">
            <strong>${data.total}</strong> rezultate pentru <strong>"${escapeHtml(q)}"</strong>
            ${carte ? `<span style="color:var(--text-dim)"> (filtrat)</span>` : ''}
            ${carte ? `<a href="/search?q=${encodeURIComponent(q)}" class="facet" style="display:inline-block;margin-left:8px">✕ elimină filtrul</a>` : ''}
          </div>
        `;

        // Facets (filter by book)
        if (data.filtre && data.filtre.length > 1 && !carte) {
          html += `<div class="facets">${data.filtre.slice(0, 15).map(f => `
            <a href="/search?q=${encodeURIComponent(q)}&carte=${f.id}" class="facet">
              ${f.nume} <span class="count">${f.count}</span>
            </a>
          `).join('')}</div>`;
        }

        // Results
        html += data.results.map(r => `
          <div class="result">
            <a href="/carte/${encodeURIComponent(r.carte)}/capitol/${r.capitol}#${r.verset}" class="ref" data-spa>
              ${r.referinta}
            </a>
            <div class="text">${highlightText(r.text, q)}</div>
            <div class="meta">${r.testament === 'OT' ? 'VT' : r.testament === 'NT' ? 'NT' : 'DC'} · ${r.text.length} caractere</div>
          </div>
        `).join('');

        // Pagination
        const totalPages = Math.ceil(data.total / (limit || 20));
        const currentPage = Math.floor((offset || 0) / (limit || 20)) + 1;
        if (totalPages > 1) {
          html += '<div class="pagination">';
          // Previous
          const prevOffset = Math.max(0, (offset || 0) - (limit || 20));
          html += (offset > 0)
            ? `<a href="/search?q=${encodeURIComponent(q)}${carte ? `&carte=${carte}` : ''}&offset=${prevOffset}">◀ Anterioară</a>`
            : `<a class="disabled">◀ Anterioară</a>`;

          // Page numbers
          const startPage = Math.max(1, currentPage - 2);
          const endPage = Math.min(totalPages, currentPage + 2);
          for (let p = startPage; p <= endPage; p++) {
            const pageOffset = (p - 1) * (limit || 20);
            html += p === currentPage
              ? `<a class="active">${p}</a>`
              : `<a href="/search?q=${encodeURIComponent(q)}${carte ? `&carte=${carte}` : ''}&offset=${pageOffset}">${p}</a>`;
          }

          // Next
          const nextOffset = (offset || 0) + (limit || 20);
          html += (nextOffset < data.total)
            ? `<a href="/search?q=${encodeURIComponent(q)}${carte ? `&carte=${carte}` : ''}&offset=${nextOffset}">Următoare ▶</a>`
            : `<a class="disabled">Următoare ▶</a>`;

          html += '</div>';
        }

        showContent(html);
        document.getElementById('searchInput').value = q;
      } catch (err) {
        showContent(`<div class="empty-state"><div class="icon">❌</div><p>Eroare: ${err.message}</p></div>`);
      }
    }

    // ─── Utilities ───────────────────────────────────────────
    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function highlightText(text, query) {
      if (!query || !text) return escapeHtml(text);
      const words = query.split(/\s+/).filter(w => w.length > 2);
      if (words.length === 0) return escapeHtml(text);
      let result = escapeHtml(text);
      for (const word of words) {
        const escaped = word.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp('(' + escaped + ')', 'gi');
        result = result.replace(regex, '<mark>$1</mark>');
      }
      return result;
    }

    // ─── Offline simplu: IndexedDB ───────────────────────────

    const DB_NAME = 'biblia-offline';
    const DB_VER = 1;

    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, DB_VER);
        req.onupgradeneeded = () => {
          const db = req.result;
          if (!db.objectStoreNames.contains('capitole')) {
            const store = db.createObjectStore('capitole', { keyPath: 'id' });
            store.createIndex('carte', 'carte', { unique: false });
          }
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // Salvează capitol
    async function saveChapter(bookName, bookEncoded, chapter, bookTotalChapters) {
      const db = await openDB();
      const data = await api(`/api/books/${bookEncoded}/chapters/${chapter}`);
      const entry = {
        id: `${bookName}|${chapter}`,
        carte: bookName,
        carte_encoded: bookEncoded,
        capitol: chapter,
        total_capitole: bookTotalChapters,
        data: data,
        salvat: Date.now()
      };
      await new Promise((resolve, reject) => {
        const tx = db.transaction('capitole', 'readwrite');
        tx.objectStore('capitole').put(entry);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    // Șterge capitol
    async function deleteSavedChapter(bookName, chapter) {
      const db = await openDB();
      await new Promise((resolve, reject) => {
        const tx = db.transaction('capitole', 'readwrite');
        tx.objectStore('capitole').delete(`${bookName}|${chapter}`);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
      });
      db.close();
    }

    // Verifică dacă e salvat
    async function isChapterSaved(bookName, chapter) {
      try {
        const db = await openDB();
        const result = await new Promise((resolve) => {
          const tx = db.transaction('capitole', 'readonly');
          const req = tx.objectStore('capitole').get(`${bookName}|${chapter}`);
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        });
        db.close();
        return result;
      } catch(e) { return null; }
    }

    // Toate capitolele salvate
    async function getAllSaved() {
      try {
        const db = await openDB();
        const result = await new Promise((resolve) => {
          const tx = db.transaction('capitole', 'readonly');
          const req = tx.objectStore('capitole').getAll();
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve([]);
        });
        db.close();
        return result.sort((a, b) => a.carte.localeCompare(b.carte) || a.capitol - b.capitol);
      } catch(e) { return []; }
    }

    // UI: toggle save
    async function toggleSave(bookEncoded, chapter, bookName, totalChapters) {
      const btn = document.getElementById('saveBtn');
      const status = document.getElementById('saveStatus');
      if (!btn || btn.disabled) return;

      // If already saved, delete
      const existing = await isChapterSaved(bookName, chapter);
      if (existing) {
        await deleteSavedChapter(bookName, chapter);
        btn.textContent = '📥 Salvează offline';
        btn.classList.remove('saved');
        btn.disabled = false;
        status.textContent = '🗑 Șters';
        return;
      }

      btn.disabled = true;
      btn.textContent = '⏳ Se salvează...';
      try {
        await saveChapter(bookName, bookEncoded, chapter, totalChapters);
        btn.textContent = '✓ Salvat ✔';
        btn.classList.add('saved');
        btn.disabled = false;
        status.textContent = '';
      } catch(e) {
        btn.textContent = '✗ Eroare';
        btn.disabled = false;
        status.textContent = 'Nu s-a putut salva';
      }
    }

    // Verifică UI după render
    async function checkIfSaved(bookEncoded, chapter) {
      try {
        const bookName = decodeURIComponent(bookEncoded);
        const existing = await isChapterSaved(bookName, chapter);
        if (existing) {
          const btn = document.getElementById('saveBtn');
          if (btn) {
            btn.textContent = '✓ Salvat ✔';
            btn.classList.add('saved');
          }
        }
      } catch(e) {}
    }

    // Pagina /salvate
    async function renderSaved() {
      showLoader('Se încarcă...');
      const items = await getAllSaved();

      if (items.length === 0) {
        showContent(`<div class="empty-state"><div class="icon">📥</div><p>Niciun capitol salvat.</p><p style="margin-top:6px;color:var(--text-dim)">Navighează la un capitol și apasă "Salvează offline".</p><p style="margin-top:12px"><a href="/" class="facet">📖 Navighează cărți</a></p></div>`);
        return;
      }

      const byBook = {};
      items.forEach(item => {
        if (!byBook[item.carte]) byBook[item.carte] = [];
        byBook[item.carte].push(item);
      });

      let html = `<h2 style="color:var(--gold);margin-bottom:15px">📚 Capitole salvate (${items.length})</h2>`;
      html += `<div style="margin-bottom:15px;display:flex;gap:8px;flex-wrap:wrap"><button class="save-btn" onclick="deleteAllSaved()">🗑 Șterge tot</button></div>`;

      for (const [carte, chapters] of Object.entries(byBook)) {
        html += `<div class="saved-book"><div class="saved-book-title">${carte} <span style="color:var(--text-dim);font-size:0.8em">(${chapters.length})</span></div>`;
        chapters.forEach(ch => {
          html += `<span class="saved-chapter"><a href="/carte/${ch.carte_encoded}/capitol/${ch.capitol}" data-spa style="color:var(--text);text-decoration:none">${ch.capitol}</a><span class="del" onclick="deleteOne('${ch.carte}', ${ch.capitol}, this)">×</span></span>`;
        });
        html += `</div>`;
      }

      showContent(html);
    }

    async function deleteOne(carte, capitol, el) {
      await deleteSavedChapter(carte, capitol);
      const parent = el.closest('.saved-chapter');
      if (parent) parent.remove();
    }

    async function deleteAllSaved() {
      if (!confirm('Ștergi toate capitolele salvate?')) return;
      const items = await getAllSaved();
      for (const item of items) {
        await deleteSavedChapter(item.carte, item.capitol);
      }
      renderSaved();
    }

              ).join('')}
            </select>
            <button onclick="changeMonth(${an}, ${luna}, 1)">▶</button>
          </div>
        </div>
        ${todayHtml}
        <div class="cal-grid">
          ${DAY_NAMES.map(d => `<div class="cal-header">${d}</div>`).join('')}
          ${Array(startOffset).fill('<div class="cal-day empty"></div>').join('')}
          ${Array.from({length: daysInMonth}, (_, i) => {
            const zi = i + 1;
            const info = dayMap[zi];
            const isToday = `${an}-${luna}-${zi}` === todayStr;
            const isSelected = zi === (window._calZi || (astazi && astazi.zi === (now.getDate()) && todayStr ? (now.getDate()) : null));
            const tip = info ? info.tip : 'normal';
            const isPost = info && info.comentarii && info.comentarii.toLowerCase().includes('post');
            let cls = 'cal-day';
            if (isToday) cls += ' today';
            if (tip === 'sarbatoare') cls += ' sarbatoare';
            if (isPost) cls += ' post';
            if (isSelected) cls += ' selected';
            const shortSaint = info && info.sfinti ? info.sfinti.substring(0, 30).replace(/\(†\)\s*|†\s*/g, '') : '';
            return `<div class="${cls}" onclick="selectDay(${zi})" title="${escapeHtml(info ? (info.sfinti || '') : '')}">
              <div class="day-num">${zi}</div>
              ${shortSaint ? `<span class="day-name">${escapeHtml(shortSaint)}</span>` : ''}
            </div>`;
          }).join('')}
        </div>
      `;

      // Selected day detail
      const selZi = window._calZi || (astazi && astazi.zi === now.getDate() ? astazi.zi : 1);
      if (dayMap[selZi]) {
        html += `<div id="calDetail">${renderDayDetail(dayMap[selZi], selZi, luna_nume, an)}</div>`;
      } else if (zile.length > 0) {
        html += `<div id="calDetail">${renderDayDetail(zile[0], 1, luna_nume, an)}</div>`;
      } else {
        html += '<div id="calDetail"><p style="color:var(--text-dim)">Nicio informație disponibilă.</p></div>';
      }

      showContent(html);
    }

    function renderDayDetail(info, zi, luna_nume, an) {
      const tipText = info.tip === 'sarbatoare' ? '⭐ Sărbătoare' : info.tip === 'duminica' ? '✝ Duminică' : '';

      let html = `<div class="cal-detail">
        <h2>${zi} ${luna_nume} ${an} <span class="day-of-week">${info.zi_sapt || ''}</span></h2>
        <div class="saint-name">${escapeHtml(info.sfinti || '—')}</div>
        ${tipText ? `<div class="feast">${tipText}</div>` : ''}
        ${info.comentarii ? `<div class="fast-info">${iconForComment(info.comentarii)} ${escapeHtml(info.comentarii)}</div>` : ''}
        ${info.duminica_titlu ? `<div class="sunday-info">${escapeHtml(info.duminica_titlu)}</div>` : ''}
        ${info.duminica_subtitlu ? `<div class="sunday-gospel">${escapeHtml(info.duminica_subtitlu)}</div>` : ''}
      </div>`;
      return html;
    }

    function iconForComment(text) {
      const t = text.toLowerCase();
      if (t.includes('post negru')) return '⬛';
      if (t.includes('dezlegare la pește') || t.includes('dezlegare la peşte')) return '🐟';
      if (t.includes('dezlegare la ulei') || t.includes('dezlegare la vin')) return '🍷';
      if (t.includes('dezlegare la brânză') || t.includes('dezlegare la brânza') || t.includes('lapte') || t.includes('ouă')) return '🧀';
      if (t.includes('post')) return '🥬';
      if (t.includes('harți') || t.includes('harti')) return '🍃';
      if (t.includes('tedeum')) return '🙏';
      if (t.includes('lăsatul') || t.includes('lasatul')) return '🥩';
      if (t.includes('aliturgic')) return '⛪';
      if (t.includes('începutul') || t.includes('începutul')) return '📅';
      if (t.includes('dezlegare')) return '🍽️';
      return '📌';
    }

    // Calendar navigation helpers
    function changeMonth(an, luna, dir) {
      let newLuna = luna + dir;
      let newAn = an;
      if (newLuna < 1) { newLuna = 12; newAn--; }
      if (newLuna > 12) { newLuna = 1; newAn++; }
      if (newAn < 2025) newAn = 2025;
      if (newAn > 2037) newAn = 2037;
      window._calAn = newAn;
      window._calLuna = newLuna;
      window._calZi = null;
      renderCalendar();
    }

    function changeCalendarMonth(sel) {
      window._calLuna = parseInt(sel.value);
      window._calZi = null;
      renderCalendar();
    }

    function changeCalendarYear(sel) {
      window._calAn = parseInt(sel.value);
      window._calZi = null;
      renderCalendar();
    }

    function selectDay(zi) {
      window._calZi = zi;
      // No API call — just update selected highlight + detail card from cache
      document.querySelectorAll('.cal-day').forEach(el => {
        const num = parseInt(el.querySelector('.day-num')?.textContent);
        if (num === zi) el.classList.add('selected');
        else el.classList.remove('selected');
      });
      // Update detail card
      const data = window._calData;
      if (!data) return;
      const info = data.zile.find(d => d.zi === zi);
      if (!info) return;
      const detailEl = document.getElementById('calDetail');
      if (detailEl) {
        detailEl.innerHTML = renderDayDetail(info, zi, data.luna_nume, data.an);
      }
    }

    // ─── Initial Render ──────────────────────────────────────
    render();
  </script>
</body>
</html>
